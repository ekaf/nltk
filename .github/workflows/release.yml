name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  gate-on-ci:
    name: Gate release on CI success for this tag commit
    runs-on: ubuntu-latest
    steps:
      - name: Require latest CI run on this commit to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          wf="ci.yml"                     # .github/workflows/ci.yml
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"

          attempts=60                     # 60 * 20s = 20 minutes
          delay=20
          per_page=50                     # robustness for busy repos

          for _ in $(seq 1 "$attempts"); do
            run=$(gh api "repos/${repo}/actions/workflows/${wf}/runs?per_page=${per_page}" \
              --jq "[.workflow_runs[] | select(.head_sha==\"$sha\")] | sort_by(.run_number) | last")

            status=$(jq -r '.status // empty' <<<"$run")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run")

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "CI conclusion: $conclusion"
              exit 1
            fi

            sleep "$delay"
          done

          echo "Timed out waiting (20 minutes) for CI to complete for $sha"
          exit 1

  build-and-release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    needs: gate-on-ci
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
