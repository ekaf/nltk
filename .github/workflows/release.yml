name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/develop

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install -U pip && pip install -r requirements.txt build

      - run: python -m build

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
